{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="card">
  <h2>{{ code }}</h2>
  <p>{{ message }}</p>
  <a href="{{ url_for('dashboard') }}" class="btn-sm">Back to dashboard</a>
</div>
{% endblock %}
{% block public %}
<div class="login-page">
  <div class="login-card">
    <h2>{{ code }}</h2>
    <p class="center">{{ message }}</p>
    <p class="center"><a href="{{ url_for('login') }}">Go to login</a></p>
  </div>
</div>
{% endblock %}
