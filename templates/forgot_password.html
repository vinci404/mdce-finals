{% extends "base.html" %}
{% block title %}Forgot password - MDCE FleetHub{% endblock %}
{% block public %}
<div class="login-page">
  <div class="login-card">
    <h2>Forgot your password?</h2>
    <p class="center">
      Enter the email address connected to your MDCE FleetHub account.
    </p>

    <form method="POST">
      <label for="reset-email">Email</label>
      <input
        type="email"
        id="reset-email"
        name="email"
        placeholder="Email"
        autocomplete="email"
        required
      />
      <button class="btn" type="submit">Email reset link</button>
    </form>

    {% if message %}
    <p class="flash center">{{ message }}</p>
    {% endif %}

    <p class="center">
      <a href="{{ url_for('login') }}">Back to log in</a>
    </p>
  </div>
</div>
{% endblock %}
